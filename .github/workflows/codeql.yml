
name: CodeQL Security Analysis

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: "30 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: autobuild

      - name: Build
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
