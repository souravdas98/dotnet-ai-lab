
name: .NET CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/*.csproj

      - name: Display SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore DotNetAiLab.sln

      - name: Verify formatting
        run: dotnet format DotNetAiLab.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DotNetAiLab.sln -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test DotNetAiLab.sln
          -c Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory ./TestResults

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
