
name: Bug Report
description: Report a problem in dotnet-ai-lab
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK version
      placeholder: "10.0.x"

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
